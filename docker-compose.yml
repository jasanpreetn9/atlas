services:
  atlas:
    build: .
    image: atlas:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      PORT: 3000
      HOST: 0.0.0.0
    # Hardening: the app needs no shell, no filesystem writes and no elevated
    # privileges - it only proxies HTTP calls to Sonarr/Radarr.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
